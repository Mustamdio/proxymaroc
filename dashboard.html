<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - ProxyMaroc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

    <!-- Navbar لوحة التحكم -->
    <header class="w-full border-b border-slate-800/60 bg-slate-900/50 backdrop-blur-md px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-reverse space-x-3">
            <div class="bg-emerald-500 text-slate-950 p-2 rounded-xl flex items-center justify-center font-bold">
                <i class="fa-solid fa-chart-line text-lg"></i>
            </div>
            <span class="font-bold text-lg text-white">لوحة تحكم العضو</span>
        </div>
        <div class="flex items-center space-x-reverse space-x-4">
            <span id="usernameDisplay" class="text-sm text-slate-300 font-medium">جاري التحميل...</span>
            <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs px-3 py-2 rounded-xl transition border border-red-500/20">
                <i class="fa-solid fa-right-from-bracket ml-1"></i> خروج
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-4xl mx-auto px-6 py-10 space-y-6">
        
        <!-- تنبيه التحديثات إذا وجدت -->
        <div id="updateAlert" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-400 p-4 rounded-2xl text-sm flex items-center justify-between">
            <span><i class="fa-solid fa-triangle-exclamation ml-2"></i> تم تحديث الأيبيهات في المكان الخاص بك، يرجى إعادة الشراء أو التحميل للحصول على النسخة الجديدة.</span>
        </div>

        <!-- بطاقة معلومات الباقة -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <h2 class="text-xl font-bold text-white mb-2">معلومات الاشتراك</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span class="text-slate-400 block mb-1">الباقة المحددة:</span>
                    <span id="selectedPack" class="text-white font-bold text-base">0 IP</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span class="text-slate-400 block mb-1">حالة الدفع:</span>
                    <span id="paymentStatus" class="font-bold text-base">-</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span class="text-slate-400 block mb-1">حالة الحساب:</span>
                    <span id="accountStatus" class="font-bold text-base">-</span>
                </div>
            </div>

            <!-- أزرار العمليات -->
            <div class="pt-4 flex flex-wrap gap-4">
                <button onclick="buyProxies()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-500/20 flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i> تأكيد الشراء وسحب الأيبيهات
                </button>
                <a id="downloadBtn" href="#" class="hidden bg-slate-800 hover:bg-slate-700 text-white font-bold px-6 py-3 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> تحميل ملف البروكسيات (.txt)
                </a>
            </div>
        </div>

        <!-- قسم عرض الأيبيهات المسحوبة -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-bold text-white mb-4">الأيبيهات الخاصة بك</h2>
            <div id="ipsContainer" class="bg-slate-950 border border-slate-800 rounded-xl p-4 h-48 overflow-y-auto font-mono text-xs text-emerald-400 space-y-1">
                جاري التحميل أو لا توجد أيبيهات مسحوبة بعد...
            </div>
        </div>

    </main>

    <script>
        // استخراج الـ ID من الرابط أو التخزين المحلي
        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get('id');

        if (!userId) {
            userId = localStorage.getItem('proxyUserId');
        }

        if (!userId) {
            alert("يرجى تسجيل الدخول أولاً.");
            window.location.href = 'index.html';
        } else {
            localStorage.setItem('proxyUserId', userId);
            loadUserData();
        }

        // جلب بيانات المستخدم من السيرفر
        async function loadUserData() {
            try {
                const res = await fetch(`/api/user/${userId}`);
                const data = await res.json();

                if (data.success) {
                    const user = data.user;
                    document.getElementById('usernameDisplay').innerText = user.username;
                    document.getElementById('selectedPack').innerText = `${user.selectedPack} IP`;
                    
                    const payStatusEl = document.getElementById('paymentStatus');
                    payStatusEl.innerText = user.paymentStatus === 'paid' ? 'مدفوع' : 'قيد الانتظار';
                    payStatusEl.className = user.paymentStatus === 'paid' ? 'text-emerald-400 font-bold text-base' : 'text-amber-400 font-bold text-base';

                    const accStatusEl = document.getElementById('accountStatus');
                    accStatusEl.innerText = user.status === 'active' ? 'نشط' : 'محظور';
                    accStatusEl.className = user.status === 'active' ? 'text-emerald-400 font-bold text-base' : 'text-red-400 font-bold text-base';

                    if (data.needsUpdate) {
                        document.getElementById('updateAlert').classList.remove('hidden');
                    }

                    // عرض الأيبيهات إن وجدت
                    const ipsContainer = document.getElementById('ipsContainer');
                    if (user.assignedIps && user.assignedIps.length > 0) {
                        ipsContainer.innerHTML = user.assignedIps.map(ip => `<div>${ip}</div>`).join('');
                        
                        // إظهار زر التحميل
                        const downloadBtn = document.getElementById('downloadBtn');
                        downloadBtn.href = `/api/download-ips/${userId}`;
                        downloadBtn.classList.remove('hidden');
                    } else {
                        ipsContainer.innerHTML = '<span class="text-slate-500">لم تقم بسحب أي أيبيهات بعد. انقر على زر الشراء أعلاه.</span>';
                    }

                } else {
                    alert(data.message || "المستخدم غير موجود");
                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.error("خطأ في الاتصال:", err);
            }
        }

        // تنفيذ عملية الشراء
        async function buyProxies() {
            try {
                const res = await fetch(`/api/buy/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();

                if (data.success) {
                    alert(data.message);
                    loadUserData(); // إعادة تحديث البيانات في الصفحة
                } else {
                    alert(data.message || "حدث خطأ أثناء عملية الشراء");
                }
            } catch (err) {
                alert("خطأ في الاتصال بالخادم");
            }
        }

        // تسجيل الخروج
        function logout() {
            localStorage.removeItem('proxyUserId');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
