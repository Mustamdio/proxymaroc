<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر البروكسيات - Proxy Store</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-sans">

    <div class="container mx-auto px-4 py-10">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-2">متجر بروكسيات محلية بدون ترافيك</h1>
            <p class="text-gray-400">اختر الباقة المناسبة لك وسجل مباشرة بكل سهولة</p>
        </header>

        <!-- زر تسجيل الدخول للمسجلين مسبقاً -->
        <div class="flex justify-end mb-6">
            <button onclick="openLoginModal()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">تسجيل الدخول</button>
        </div>

        <!-- شبكة الباقات -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto">
            <!-- باقة 50 IP -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 text-center">
                <h3 class="text-xl font-semibold mb-4">50 IP</h3>
                <p class="text-3xl font-bold text-green-400 mb-6">25 USDT</p>
                <button onclick="selectPack(50)" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold">شراء الباقة</button>
            </div>
            <!-- باقة 100 IP -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 text-center">
                <h3 class="text-xl font-semibold mb-4">100 IP</h3>
                <p class="text-3xl font-bold text-green-400 mb-6">40 USDT</p>
                <button onclick="selectPack(100)" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold">شراء الباقة</button>
            </div>
            <!-- باقة 200 IP -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 text-center">
                <h3 class="text-xl font-semibold mb-4">200 IP</h3>
                <p class="text-3xl font-bold text-green-400 mb-6">70 USDT</p>
                <button onclick="selectPack(200)" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold">شراء الباقة</button>
            </div>
            <!-- باقة 300 IP -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 text-center">
                <h3 class="text-xl font-semibold mb-4">300 IP</h3>
                <p class="text-3xl font-bold text-green-400 mb-6">100 USDT</p>
                <button onclick="selectPack(300)" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold">شراء الباقة</button>
            </div>
            <!-- باقة 400 IP -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 text-center">
                <h3 class="text-xl font-semibold mb-4">400 IP</h3>
                <p class="text-3xl font-bold text-green-400 mb-6">130 USDT</p>
                <button onclick="selectPack(400)" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold">شراء الباقة</button>
            </div>
            <!-- باقة 500 IP -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 text-center">
                <h3 class="text-xl font-semibold mb-4">500 IP</h3>
                <p class="text-3xl font-bold text-green-400 mb-6">170 USDT</p>
                <button onclick="selectPack(500)" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold">شراء الباقة</button>
            </div>
        </div>
    </div>

    <!-- نافذة التسجيل السريع المنبثقة (Modal) -->
    <div id="registerModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-lg max-w-md w-full relative">
            <h2 id="modalTitle" class="text-2xl font-bold mb-4">إنشاء حساب جديد</h2>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="mb-4">
                    <label class="block text-sm mb-2">اسم المستخدم (Username)</label>
                    <input type="text" id="username" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
                </div>
                <div class="mb-4">
                    <label class="block text-sm mb-2">كلمة المرور (Password)</label>
                    <input type="password" id="password" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
                </div>
                <div class="flex justify-end space-x-2 space-x-reverse">
                    <button type="button" onclick="closeModal()" class="bg-gray-600 px-4 py-2 rounded">إلغاء</button>
                    <button type="submit" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded font-bold">تسجيل ومتابعة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-lg max-w-md w-full relative">
            <h2 class="text-2xl font-bold mb-4">تسجيل الدخول</h2>
            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-sm mb-2">اسم المستخدم</label>
                    <input type="text" id="loginUser" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
                </div>
                <div class="mb-4">
                    <label class="block text-sm mb-2">كلمة المرور</label>
                    <input type="password" id="loginPass" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
                </div>
                <div class="flex justify-end space-x-2 space-x-reverse">
                    <button type="button" onclick="closeLoginModal()" class="bg-gray-600 px-4 py-2 rounded">إلغاء</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-bold">دخول</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let selectedPackSize = 0;

        function selectPack(size) {
            selectedPackSize = size;
            document.getElementById('registerModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('registerModal').classList.add('hidden');
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, packSize: selectedPackSize })
            });

            const data = await res.json();
            if (data.success) {
                alert('⚠️ تنبيه هام جداً:\nحفظ اسم المستخدم وكلمة المرور في مكان آمن! هذه هي وسيلتك الوحيدة للدخول للموقع.');
                localStorage.setItem('userId', data.userId);
                window.location.href = 'dashboard.html';
            } else {
                alert(data.message);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (data.success) {
                localStorage.setItem('userId', data.userId);
                if (data.isAdmin) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
