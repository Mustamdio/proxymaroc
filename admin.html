<script>
        // التحقق من أن المستخدم أدمن عبر جلب بيانات الجلسة من السيرفر أولاً
        async function checkAdminAuth() {
            try {
                const res = await fetch('/api/admin/data');
                const data = await res.json();
                if (!data.success) {
                    window.location.href = 'index.html';
                } else {
                    loadAdminData(data);
                }
            } catch (err) {
                window.location.href = 'index.html';
            }
        }

        async function loadAdminData(initialData = null) {
            try {
                let data = initialData;
                if (!data) {
                    const res = await fetch('/api/admin/data');
                    data = await res.json();
                }

                if (data.success) {
                    // تعبئة جدول الأعضاء
                    const tbody = document.getElementById('usersTableBody');
                    tbody.innerHTML = data.users.map(user => `
                        <tr class="hover:bg-slate-950/50">
                            <td class="p-3 font-bold text-white">${user.username}</td>
                            <td class="p-3">${user.selectedPack} IP</td>
                            <td class="p-3">${user.assignedPool ? 'المكان ' + user.assignedPool : 'غير مرتبطة'}</td>
                            <td class="p-3"><span class="${user.paymentStatus === 'paid' ? 'text-emerald-400' : 'text-amber-400'}">${user.paymentStatus}</span></td>
                            <td class="p-3"><span class="${user.status === 'active' ? 'text-emerald-400' : 'text-red-400'}">${user.status}</span></td>
                            <td class="p-3 space-x-reverse space-x-2">
                                <span class="text-slate-500 text-xs">قريباً التحكم الكامل</span>
                            </td>
                        </tr>
                    `).join('');

                    // عرض حالة الأماكن
                    const poolsGrid = document.getElementById('poolsGrid');
                    poolsGrid.innerHTML = data.pools.map(pool => {
                        const unusedCount = pool.ips.filter(i => !i.isUsed).length;
                        return `
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-1">
                                <div class="text-white font-bold">المكان رقم ${pool.poolNumber}</div>
                                <div class="text-xs text-slate-400">المتاح: <span class="text-emerald-400 font-bold">${unusedCount}</span> IP</div>
                                <div class="text-xs text-slate-500">النسخة: v${pool.version}</div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                console.error("خطأ في جلب بيانات الأدمن:", err);
            }
        }

        async function restockPool() {
            const poolNumber = document.getElementById('poolNumberInput').value;
            const ipsText = document.getElementById('ipsTextInput').value;

            if (!ipsText.trim()) {
                alert("يرجى إدخال الأيبيهات أولاً.");
                return;
            }

            try {
                const res = await fetch('/api/admin/restock-pool', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ poolNumber: parseInt(poolNumber), ipsText })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    document.getElementById('ipsTextInput').value = '';
                    loadAdminData();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("خطأ في الاتصال بالخادم");
            }
        }

        function logout() {
            localStorage.removeItem('proxyUserId');
            window.location.href = '/logout';
        }

        // تشغيل التحقق عند تحميل الصفحة
        checkAdminAuth();
    </script>
